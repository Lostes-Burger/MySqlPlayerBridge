# 消息前缀可在config.yml文件中修改
# 任何更改都需要重启服务器才能生效


# 数据库配置错误提示：当管理员未填写MySQL数据库连接信息时，玩家尝试加入服务器会收到此消息
no-database-config-error: "§c请在mysql.yml配置文件中输入mysql凭据。重启后使用此插件！"


# 数据同步成功提示：玩家数据从主服务器成功同步到当前服务器时显示
sync-success: "§7玩家数据§a成功§9同步！"
# 数据同步失败提示：网络问题或数据库异常导致无法同步数据时显示
sync-failed: "§c玩家数据无法同步。请联系工作人员或尝试重新加入。"
sync-timeout: "§c玩家同步超过5秒超时。请重试并联系工作人员。"
cross-version-deny-kick: "§c您的玩家数据包含此服务器不支持的物品。请先加入较新的服务器并移除这些物品。"
# 数据创建成功提示：玩家在主服务器首次生成角色数据时显示
created-data: "§7玩家数据§a成功§9创建"


# 无数据准入保护踢出提示：防止玩家绕过主服务器直接加入子服务器，确保数据一致性
no-entry-protection-kick: "§c未启用进入保护。§7您没有现有的玩家数据。您不能在先加入父服务器并接收您的玩家数据之前加入此服务器。如果您认为这是一个错误，请联系服务器工作人员。"
startup-join-blocked: "§c服务器仍在启动。请稍后重试。"


# 命令相关消息配置
# 权限不足提示：玩家输入管理命令但没有相应权限时显示
permission-error: "§c执行此命令的权限不足"


# 占位符说明：<all subcommands>会被自动替换为实际的可用子命令列表
# 未知子命令提示：玩家输入了不存在的命令参数时显示，会列出可用命令
unknown-subcommand-error: '§c未知子命令。可用命令: §7<{subcommands}>'
# 缺少子命令提示：玩家输入命令但没有任何参数时显示
no-subcommand-error: '§c请提供子命令。可用命令: §7<{subcommands}>'


# 清除命令相关配置
# 清除命令用法错误提示：玩家或管理员使用/clear命令格式不正确时显示
clear-wrong-usage: "§c用法错误！使用clear <玩家名/*>"
# 清除目标不存在提示：尝试清除一个不存在的玩家数据时显示
clear-player-not-found: "§c未找到玩家。§7此玩家未知。删除失败！"


# 手动同步命令相关配置
# 手动同步成功提示：管理员使用/sync命令强制同步玩家数据成功后显示
manual-sync-success: "§7所有玩家数据已§a成功§7同步"
# 手动同步用法错误提示：管理员使用/sync命令格式不正确时显示
manual-sync-wrong-usage: "§c用法错误！使用sync <玩家名/*>"
# 手动同步目标不存在提示：管理员尝试同步不存在的玩家数据时显示
manual-sync-player-not-found: "§c未找到玩家。§7此玩家未知。同步失败！"


# 编辑命令相关配置
# 编辑命令用法错误提示：玩家或管理员使用/edit命令格式不正确时显示
edit-wrong-usage: "§c用法错误！使用 edit <玩家名/*> <数据类型> <数值>"
# 编辑目标不存在提示：尝试编辑数据库中不存在的玩家数据时显示
edit-player-not-found: "§c未在数据库中找到该玩家。"
# 编辑目标跨服在线提示：尝试编辑当前正在其他服务器在线的玩家数据时显示
edit-player-online-other-server: "§c该玩家当前正在另一台服务器上在线。"
# 编辑目标需指定玩家提示：尝试对所有玩家执行仅支持特定玩家的数据类型编辑时显示
edit-target-required-player: "§c此数据类型只能针对指定玩家进行编辑。"
# 控制台无法打开GUI提示：非玩家身份（如控制台）尝试编辑背包数据时显示
edit-console-no-gui: "§c只有玩家才能编辑背包数据。"
# Vault经济模块未启用提示：尝试编辑经济相关数据但Vault模块未开启时显示
edit-vault-disabled: "§cVault 经济模块未启用。"
# 编辑数值无效提示：输入的数值格式或内容不符合要求时显示
edit-invalid-value: "§c无效数值: {reason}"
# 编辑数据库错误提示：数据库操作异常时显示
edit-db-error: "§c数据库错误。请查看控制台。"
# 编辑前同步超时提示：编辑前数据同步超过5秒未完成时显示
edit-pre-sync-timeout: "§c玩家 {player} 的编辑前同步在5秒后超时。编辑已取消。"
# 编辑前同步失败提示：编辑前数据同步失败时显示
edit-pre-sync-failed: "§c玩家 {player} 的编辑前同步失败。编辑已取消。"
# 编辑成功提示：指定玩家数据编辑完成后显示
edit-success: "§7玩家数据已§a成功§7更新。"
# 批量编辑成功提示：所有玩家数据编辑完成后显示
edit-success-all: "§7所有玩家的数据已§a成功§7更新。"
# 编辑GUI标题：打开数据编辑界面时显示的标题
edit-gui-title: "§9为 {player} 编辑 {type}"
# 编辑命令完整用法提示
edit-usage: "§c用法: /{command} edit {usage}"


# 更新检查相关配置
# 新版本可用提示：检测到插件正式版更新时显示
update-available: "MySqlPlayerBridge 插件有新版本可用！当前版本: {installed}，最新版本: {latest}。"
# 预发布版本可用提示：检测到插件预发布版更新时显示
update-available-prerelease: "MySqlPlayerBridge 插件有新的预发布版本可用！当前版本: {installed}，最新版本: {latest}。"
# 下载更新提示：点击可跳转至下载页面
download-update: "§9点击 §c[§5此处§c] §9访问下载页面。"
# 更新检查失败提示：连接GitHub检查更新失败或返回异常数据时显示
update-check-failed: "GitHub 更新检查失败或返回了无效数据: {reason}"
